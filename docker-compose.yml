x-app-build: &app-build
  build:
    context: .
  env_file:
    - .env
  environment:
    DB_URL: postgresql://postgres:postgres@db:5432/postgres
    REDIS_URL: redis://redis:6379
    MINIO__ENDPOINT: minio:9000
    MINIO__ACCESS_KEY: minioadmin
    MINIO__SECRET_KEY: minioadmin
    MINIO__PUBLIC_BUCKET: public
    MINIO__PRIVATE_BUCKET: private
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    HUEY_WORKERS: ${HUEY_WORKERS:-6}

x-app-common: &app-common
  <<: *app-build
  volumes:
    - ./logs:/dist/logs
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  migrate:
    <<: *app-build
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    <<: *app-common
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - ${GUNICORN_WORKERS:-4}
      - --timeout
      - "300"
      - --graceful-timeout
      - "300"
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 60s
      timeout: 10s
      retries: 3

  worker:
    <<: *app-common
    command: ["python", "manage.py", "run_huey"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - 9000:9000
      - 9001:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/public &&
      mc mb --ignore-existing local/private &&
      mc anonymous set download local/public
      "

volumes:
  db-data:
  redis-data:
  minio-data:
