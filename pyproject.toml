[project]
name = "drf-starter-kit"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
src = [
    "attachment",
    "config",
    "extensions",
    "i18n",
    "identity",
    "integrations",
    "journal",
    "notification",
    "shared_kernel",
    "user",
    "utils",
]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-third-party = ["minio"]
known-first-party = [
    "attachment",
    "config",
    "env",
    "extensions",
    "i18n",
    "identity",
    "integrations",
    "journal",
    "notification",
    "shared_kernel",
    "user",
    "utils",
]

[tool.ruff.format]
quote-style = "double"
